<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>AI Learning Assistant</title></head>
<body>
    
    
    <main class="container">
        <!-- heading of the website  -->
        <h1>AI Learning Assistant</h1>       
        <h2>AHGV Hackathon</h2>
        
        <!-- lecture section -->
        <section class="lecture-section">
            
            <h2>Lecture</h2>

                <video id="lectureVideo" controls>
                    <source src="Files/AI Lecture 1.mp4" type="video/mp4">
                </video>    

                <p class="timestamp">
                    Current position:
                    <span id="timestamp">00:00</span>
                </p>

        </section>

        <aside class="side-panel"> <!--aside is used to differentiate items in the two columns-->>
            
            <section class="chat">
    
            
                <h2>AI Assistant</h2>
    
                <div id="chatMessages" class="chat-messages">
                    
                    <div class="message ai-message">
                        <strong>AI Assistant</strong>
                        <p>
                            Hi! I'm your learning assistant.
                            Ask me something about the lecture.
                        </p>
                    </div>
    
                </div>
    
    
                <div class="chat-input">
    
                    <input
                    type="text"
                        id="userInput"
                        placeholder="Ask about the lecture..."
                    >
    
                    <button id="sendButton">
                        Send
                    </button>
                    
                </div>
                
            </section>
            
        </aside>
        
        <section class="notes">                
            <h2>Lecture Notes</h2>
            
            <iframe
            src="Files/AI Notes 1.pdf"
            title="Lecture Notes"
            width="900"
            height="900">
        </iframe>

        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
